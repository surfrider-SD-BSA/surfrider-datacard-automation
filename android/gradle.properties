org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The application id. Personal, like the iOS bundle identifier it matches, and
# for the same reason: moving it later means a new store listing and a fresh
# install for everybody, not an update. Override with -Ptally.applicationId=...
tally.applicationId=com.mateobesse.surfriderdatacards

# Photographing the cards. OFF, and only a build that asks for it gets the
# button: ./gradlew assembleDebug -Ptally.beta=true. See CaptureScreen.kt.
tally.beta=false

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# A placeholder application id. The real one is not in the repository: set
# tally.applicationId in ~/.gradle/gradle.properties, which wins over this file.
# It must stay the same, or the build becomes a new app.
tally.applicationId=org.surfrider.datacards

# Photographing the cards. OFF, and only a build that asks for it gets the
# button: ./gradlew assembleDebug -Ptally.beta=true. See CaptureScreen.kt.
tally.beta=false

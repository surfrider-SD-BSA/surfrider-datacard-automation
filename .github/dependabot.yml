version: 2

# Security updates only. Version-update PRs are switched off below
# (open-pull-requests-limit: 0) because they cost more than they bought: of the
# first eight PRs merged to main, four were version bumps and two more were
# fixing their fallout, against zero vulnerabilities prevented. Dependabot
# ALERTS and SECURITY updates stay on (they are repository settings, not
# configured here — see docs/repo-setup.md), so a real advisory still opens a
# PR. The entries below are kept because their labels, commit prefixes and
# ignore rules also apply to those security PRs.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # 0 = no version-update PRs; security updates are unaffected by this limit.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    # This project supports Python 3.9 because the tool has to run on the
    # Python that ships with macOS (see CONTRIBUTING.md, "Code style"). The
    # versions below dropped 3.9, so they cannot be adopted without raising the
    # floor in pyproject.toml, the README, and the CI matrix together.
    #
    # Remove these entries when the minimum Python version moves to 3.10.
    ignore:
      # pytest 9.x requires Python >=3.10. Newest 3.9-compatible: 8.4.2.
      - dependency-name: "pytest"
        versions: [">=9.0.0"]
      # pre-commit 4.4+ requires Python >=3.10. 4.0-4.3 still support 3.9,
      # so only the 4.4 line onward is blocked.
      - dependency-name: "pre-commit"
        versions: [">=4.4.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # 0 = no version-update PRs; security updates are unaffected by this limit.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - ci
